<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Web Search Agent</title>
    <style>
        body {
            font-family: Arial;
            background: #eef2f3;
            padding: 40px;
        }
        .box {
            background: white;
            padding: 20px;
            width: 500px;
            margin: auto;
            border-radius: 8px;
            box-shadow: 0 0 10px gray;
        }
        input, button {
            width: 100%;
            padding: 10px;
            margin-top: 10px;
        }
        #result {
            margin-top: 15px;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="box">
    <h2>🌍 Web Search Agent</h2>

    <input type="text" id="query" placeholder="Search anything..." />
    <button onclick="searchWiki()">Search</button>

    <div id="result"></div>
</div>

<script>
async function searchWiki() {
    const query = document.getElementById("query").value;
    const resultDiv = document.getElementById("result");

    if (!query) {
        resultDiv.innerText = "Please enter a search WORD/SENTENCE.";
        return;
    }

    resultDiv.innerText = "🔎 Searching on internet...";

    try {
        const response = await fetch(
            `https://en.wikipedia.org/api/rest_v1/page/summary/${query}`
        );

        if (!response.ok) {
            throw new Error("Not found");
        }

        const data = await response.json();

        resultDiv.innerHTML = `
            <h3>${data.title}</h3>
            <p>${data.extract}</p>
            <a href="${data.content_urls.desktop.page}" target="_blank">
                Read more on Wikipedia
            </a>
        `;
    } catch (error) {
        resultDiv.innerText = "❌ No information found.";
    }
}
</script>

</body>
</html>
